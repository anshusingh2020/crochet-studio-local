services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crochet
      POSTGRES_USER: crochet
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run setup.sh first}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crochet -d crochet"]
      interval: 5s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/crochet
      DB_PASSWORD: ${DB_PASSWORD}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:8088}
      SECURE_COOKIE: ${SECURE_COOKIE:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-false}
      SMTP_TLS: ${SMTP_TLS:-false}
      MAIL_FROM: ${MAIL_FROM:-studio@crochet.local}
      UPLOAD_DIR: /app/uploads
      KAFKA_ENABLED: ${KAFKA_ENABLED:-false}
      KAFKA_SERVERS: kafka:9092
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["uploads:/app/uploads"]
    depends_on:
      db: {condition: service_healthy}
      mailpit: {condition: service_started}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8088:80"]
    depends_on: [backend]
  kafka:
    image: apache/kafka:4.0.2
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports: ["127.0.0.1:9094:9094"]
    volumes: ["kafka-data:/var/lib/kafka/data"]
volumes:
  postgres-data:
  uploads:
  kafka-data:
